<aside class="sidebar">

    <div class="brand-mark">A</div>
    <span class="brand-text">TraduContext</span>
  </div>

  <nav class="sidebar-nav" aria-label="Navegacion principal">
    <a class="nav-item active" routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="fa fa-home nav-icon" aria-hidden="true"></i>
      <span>Inicio</span>
    </a>
  </nav>

  <button type="button" class="nav-item nav-item-button" (click)="cerrarSesion()">

    <span>Cerrar sesion</span>

</aside>
